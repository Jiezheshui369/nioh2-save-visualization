name: Manual source and iOS checks

# No automatic release, upload, signing or paid runner trigger on push.
on:
  workflow_dispatch:
    inputs:
      ios:
        description: Also compile the unsigned iOS simulator app (uses a macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: python scripts/check_project_contract.py
      - run: npm test
      - run: npm run build
      - run: npm run build:android
      - run: python -m pip install -r packaging/requirements-runtime.txt
      - run: python -m unittest discover -s agent/tests -v
      - run: node scripts/check-effect-contract.mjs --python python
      - run: python scripts/check-android-core.py
      - run: python scripts/prepare_handoff.py --check

  ios:
    if: inputs.ios
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: xcodebuild -version
      - run: python scripts/check_project_contract.py
      - run: npm ci
      - run: sh scripts/check-ios-core.sh
      - run: npm run ios:sync
      - name: Compile unsigned simulator app (not a device test)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .local/ios-build CODE_SIGNING_ALLOWED=NO build
